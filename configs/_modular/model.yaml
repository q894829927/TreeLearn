model:
  kernel_size: 3 # kernel size of convolution layers
  channels: 32 # channel size of first convolution layer
  num_blocks: 7 # number of blocks to be used in the Unet or Lnet
  use_feats: False # whether to use precomputed features as network input or not (default is False)
  use_coords: False # whether to use the coordinates as network input or not. Coords are redundant since relativ position defined by voxel grid (default is False)
  dim_coord: 3 # dimension of coordinates (not used if use_coords is False)
  dim_feat: 1 # dimension of precomputed features (not used if use_feats is False)
  max_num_points_per_voxel: 3 # maximum number of points within a voxel to use for feature averaging (technical detail, not that important)
  fixed_modules: [] # modules whose parameters are not updated during training
  spatial_shape: ~ # spatial shape of the tiles/crops (technical detail, not that important).
  voxel_size: 0.1 # determines the voxel size in m for generating the sparse voxel grid
  use_upper_anchor: True # predict the upper morphological anchor in addition to the tree base
  upper_offset_loss_weight: 1.0 # weight of upper-anchor offset regression
  axis_loss_weight: 0.1 # weight of base-to-upper tree-axis cosine loss
  offset_loss_type: 'smooth_l1' # smooth_l1 for robustness; l2 reproduces the original loss
  smooth_l1_beta: 1.0 # transition point of Smooth L1
  use_axis_branch: False # enable the frozen-backbone Axis-XY/confidence branch
  axis_target_mode: 'upper_axis' # upper_axis preserves old experiments; base_residual corrects the frozen base vote
  axis_branch_type: 'point_transformer' # point_transformer or mlp control
  axis_hidden_dim: 32
  axis_num_neighbors: 8
  axis_support_voxel_size: 0.4
  axis_max_support_points: 32768
  axis_query_chunk_size: 8192
  axis_gradient_checkpointing: True
  axis_tree_conf_thresh: 0.5
  axis_log_variance_min: -4.0
  axis_log_variance_max: 4.0
  axis_branch_only: True # automatically freeze the original TreeLearn modules
  axis_loss_mode: 'heteroscedastic' # heteroscedastic or decoupled
  axis_confidence_loss_weight: 0.1 # used only by decoupled loss
  use_height_context_adapter: False # enable frozen-backbone height adapter
  height_context_type: 'attention' # attention (HSCA) or parameter-matched mlp
  height_hidden_dim: 32
  height_num_bins: 8
  height_num_heads: 4
  height_dropout: 0.1
  height_quantile: 0.95
  height_minimum_scale: 1.0
  height_adapter_only: True # automatically freeze all original TreeLearn modules
  height_seed_identity_weight: 0.0 # one-sided frozen-teacher seed preservation
  height_seed_identity_margin: 0.02 # allowed tree-probability reduction on base seeds
  height_seed_tree_conf_thresh: 0.5
  height_seed_tau_vert: 0.6
  height_seed_tau_off: 4.0
  height_seed_min_semantic_retention: 0.0 # hard checkpoint eligibility gate
  height_seed_membership_projection: False # preserve teacher semantic membership
  height_seed_projection_margin: 0.001 # logit distance from the decision boundary
  height_seed_offset_membership_projection: False # preserve full teacher seed set
  height_seed_offset_projection_margin: 0.001 # offset-z distance from tau_off
  # Sparse U-Net tournament. Disabled by default for full backward compatibility.
  unet_enhancement:
    enabled: False
    type: 'identity'
    levels: []
    residual_gamma_init: 0.0
    return_attention_stats: False
    hidden_ratio: 0.5
    min_hidden_channels: 8
    window_size: [4, 4, 4]
    num_heads: 4
    ffn_ratio: 2.0
    max_windows_per_chunk: 256

  unet_finetune:
    enabled: False
    freeze_input_conv: True
    freeze_encoder: True
    train_decoder_levels: [0, 1]
    train_heads: True
    keep_frozen_batchnorm_eval: True
    teacher_seed_preservation_weight: 0.0
    measure_teacher_seed_mismatch: False
    teacher_seed_tree_conf_thresh: 0.5
    teacher_seed_tau_vert: 0.6
    teacher_seed_tau_off: 4.0

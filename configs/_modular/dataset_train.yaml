dataset_train:
  training: True # True if dataset used for training; False if used for validation
  data_root: 'data/train/random_crops/npz' # folder where crops for model training are located
  data_augmentations: # list of aumgentations to be used during training
    jitter: True
    flip: True
    rot: True
    scaled: True
    point_jitter: True
  inner_square_edge_length: 8 # Length of inner square to be used for training. E.g. if tiles/crops are 30mx30m, this indicates that only inner 8x8 is taken into account (see paper for details)
  base_anchor_mode: 'robust' # use 'legacy' only for the separately reported original TreeLearn reference
  base_anchor_height: 0.5 # height in metres of the robust base-anchor band
  base_anchor_floor_quantile: 0.01 # robust lower-height estimate
  upper_anchor_lower_ratio: 0.55 # lower relative tree height of upper-anchor band
  upper_anchor_upper_ratio: 0.75 # upper relative tree height of upper-anchor band
  upper_anchor_min_points: 3 # minimum points required for upper-anchor supervision

# Q6a preregistration. Wytham is forbidden.
output_root: 'logs/coverage_preserving_quality/q6a_fragment_graph_oracle'
q3_reference_root: 'data/gt_omission_diagnostics'
source_root: 'data/train/forests'
pipeline_template: 'configs/experiments/coverage_preserving_quality/pipeline_q6a_fragment_graph_template.yaml'
checkpoint: 'work_dirs/base_residual_mlp_frozen_s43/best_base_residual_xy.pth'

validation_plots:
  - G4N
  - G4W
  - L1N
  - O1N
  - O1W

fragment_graph_oracle:
  tree_class_index: 0
  match_iou_threshold: 0.5
  min_precision_for_counted_fp: 0.5
  min_fragment_overlap_fraction: 0.05
  min_fragment_overlap_points: 20
  adjacency:
    max_vote_center_distance: 3.0
    max_raw_center_distance: 8.0
    max_xy_bbox_gap: 1.5
    max_vertical_gap: 3.0
    max_candidate_edges: 100000

gate:
  expected_validation_plots: 5
  expected_fragmentation_trees: 41
  min_union_ceiling_recovered_trees: 20
  min_union_ceiling_f1_gain_pp: 0.70
  min_graph_covered_target_trees: 25
  min_graph_recovered_trees: 10
  min_graph_f1_gain_pp: 0.50
  max_lost_baseline_trees: 0
  max_commission_increase_pp: 0.0
  min_nonnegative_plots: 4
  # The paired HDBSCAN run may move one border instance versus old Q3.
  max_reference_tp_drift_per_plot: 1
  max_reference_fp_drift_per_plot: 1
  max_reference_tp_drift_total: 1
  max_reference_fp_drift_total: 1

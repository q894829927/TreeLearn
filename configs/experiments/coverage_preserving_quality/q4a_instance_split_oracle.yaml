# Fixed-validation GT-only diagnostic. Wytham is forbidden.
output_root: 'logs/coverage_preserving_quality/q4a_instance_split_oracle'
q3_reference_root: 'data/gt_omission_diagnostics'
source_root: 'data/train/forests'
pipeline_template: 'configs/experiments/coverage_preserving_quality/pipeline_q4a_instance_split_template.yaml'
checkpoint: 'work_dirs/base_residual_mlp_frozen_s43/best_base_residual_xy.pth'

validation_plots:
  - G4N
  - G4W
  - L1N
  - O1N
  - O1W

split_oracle:
  match_iou_threshold: 0.5
  min_precision_for_counted_fp: 0.5
  min_recall_for_undersegmentation: 0.5
  max_fit_points: 50000
  random_state: 20260811
  vertical_power: 2.0
  vertical_feature_weight: 1.0

gate:
  expected_validation_plots: 5
  min_gt_ceiling_f1_gain_pp: 1.0
  min_gt_ceiling_completeness_gain_pp: 2.0
  min_geometry_recovered_trees: 22
  min_geometry_f1_gain_pp: 0.70
  max_geometry_commission_increase_pp: 1.0
  max_geometry_completeness_drop_pp: 0.50
  min_geometry_plot_wins: 4
  min_vertical_gain_over_base_vote_pp: 0.30
  min_vertical_additional_recovered_trees: 8

# Shared runtime settings for all dual-anchor ablation training runs.
# Keep this file unchanged across T0/T1/T2 to ensure a fair comparison.

dataloader:
  train:
    batch_size: 2
    num_workers: 2
  test:
    batch_size: 1
    num_workers: 1

optimizer:
  type: 'AdamW'
  lr: 0.003
  weight_decay: 0.001

scheduler:
  t_initial: 1000
  lr_min: 0.00005
  cycle_decay: 1
  warmup_lr_init: 0.00001
  warmup_t: 50
  cycle_limit: 1
  t_in_epochs: True

epochs: 1000
examples_per_epoch: 500
fp16: True
pretrain: 'data/model_weights/hais_ckpt_spconv2.pth'
grad_norm_clip: True

save_frequency: 20
validation_frequency: 20

# Proposed model: frozen TreeLearn + one local Point Transformer trained on
# exactly the same lower-stem axis target as the MLP control.
default_args:
  - "configs/_modular/model.yaml"
  - "configs/_modular/dataset_train.yaml"
  - "configs/_modular/dataset_test.yaml"

seed: 42

model:
  spatial_shape: [500, 500, 1000]
  use_upper_anchor: False
  use_axis_branch: True
  axis_branch_type: 'point_transformer'
  axis_hidden_dim: 32
  axis_num_neighbors: 8
  axis_support_voxel_size: 0.4
  axis_max_support_points: 32768
  axis_query_chunk_size: 8192
  axis_gradient_checkpointing: True
  axis_tree_conf_thresh: 0.5
  axis_loss_weight: 1.0
  axis_log_variance_min: -4.0
  axis_log_variance_max: 4.0
  axis_branch_only: True
  axis_loss_mode: 'heteroscedastic'
  offset_loss_type: 'l2'
  smooth_l1_beta: 1.0

dataset_train:
  base_anchor_mode: 'legacy'
  upper_anchor_mode: 'stem_axis'
  stem_axis_lower_ratio: 0.10
  stem_axis_upper_ratio: 0.50
  stem_axis_num_bins: 4
  stem_axis_verticality_threshold: 0.60
  stem_axis_min_points_per_bin: 3
  stem_axis_min_valid_bins: 3
  upper_anchor_target_ratio: 0.65

dataset_test:
  base_anchor_mode: 'legacy'
  upper_anchor_mode: 'stem_axis'
  stem_axis_lower_ratio: 0.10
  stem_axis_upper_ratio: 0.50
  stem_axis_num_bins: 4
  stem_axis_verticality_threshold: 0.60
  stem_axis_min_points_per_bin: 3
  stem_axis_min_valid_bins: 3
  upper_anchor_target_ratio: 0.65

dataloader:
  train:
    batch_size: 1
    num_workers: 2
  test:
    batch_size: 1
    num_workers: 1

optimizer:
  type: 'AdamW'
  lr: 0.001
  weight_decay: 0.001

scheduler:
  t_initial: 50
  lr_min: 0.00001
  cycle_decay: 1
  warmup_lr_init: 0.00001
  warmup_t: 5
  cycle_limit: 1
  t_in_epochs: True

epochs: 30
examples_per_epoch: 500
fp16: True
pretrain: 'data/model_weights/model_weights_with_small_20241213.pth'
grad_norm_clip: True
save_frequency: 10
validation_frequency: 5

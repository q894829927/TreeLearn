forest_path: 'data/pipeline/L1W/forest/L1W.npz'
fp16: True
tile_generation: False

dataloader:
  batch_size: 1
  num_workers: 2

shape_cfg:
  outer_remove: ~
  alpha: 0.6
  buffer_size_to_determine_edge_trees: 0.3

save_cfg:
  save_formats: ['laz']
  save_treewise: False
  save_pointwise: False
  return_type: 'original'

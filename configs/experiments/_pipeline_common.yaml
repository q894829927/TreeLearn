# Shared inference settings for experiments A-E.
# The forest path assumes the repository's standard L1W directory layout.

forest_path: 'data/pipeline/L1W/forest/L1W.laz'
fp16: True

dataloader:
  batch_size: 1
  num_workers: 2

shape_cfg:
  outer_remove: ~
  alpha: 0.6
  buffer_size_to_determine_edge_trees: 0.3

save_cfg:
  save_formats: ['laz']
  # The full predicted forest required by evaluation is always saved.
  # Enable these only for the final qualitative run because they are expensive.
  save_treewise: False
  save_pointwise: False
  return_type: 'original'

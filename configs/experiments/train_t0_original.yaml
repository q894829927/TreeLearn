# T0-original: exact legacy base-anchor reference from the original TreeLearn.
# Report separately from the clean A-E ablation because A-E share robust anchors.
default_args:
  - "configs/_modular/model.yaml"
  - "configs/_modular/dataset_train.yaml"
  - "configs/_modular/dataset_test.yaml"
  - "configs/experiments/_train_common.yaml"

model:
  spatial_shape: [500, 500, 1000]
  use_upper_anchor: False
  upper_offset_loss_weight: 0.0
  axis_loss_weight: 0.0
  offset_loss_type: 'l2'

dataset_train:
  base_anchor_mode: 'legacy'

dataset_test:
  base_anchor_mode: 'legacy'

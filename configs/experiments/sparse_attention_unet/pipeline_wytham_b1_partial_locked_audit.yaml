# Exploratory locked audit only: report together with B0 and M4; never tune on Wytham.
default_args:
  - configs/experiments/height_context_attention/_pipeline_wytham_locked_common.yaml
  - configs/_modular/sample_generation.yaml
  - configs/_modular/model.yaml
  - configs/_modular/grouping.yaml
  - configs/_modular/dataset_test.yaml

model:
  unet_enhancement:
    enabled: False
    type: 'identity'
    levels: []
    residual_gamma_init: 0.0
    return_attention_stats: True
  unet_finetune:
    enabled: False

pretrain: 'work_dirs/train_t1_b1_partial_seed42/best_unet.pth'

save_cfg:
  results_dir: 'results_sparse_unet_wytham_b1_partial_locked_audit'

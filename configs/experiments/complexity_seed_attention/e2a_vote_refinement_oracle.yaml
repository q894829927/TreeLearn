# Fixed-validation GT-only upper bound. Wytham is forbidden.
data_root: 'data/seed_vote_refinement'
manifest_path: 'data/seed_vote_refinement/manifest.csv'
output_dir: 'logs/complexity_seed_attention/e2a_vote_refinement_oracle'

expected_validation_plots:
  - G4N
  - G4W
  - L1N
  - O1N
  - O1W

cell_size: 0.60
topology_cell_size: 0.60
run_hdbscan: True
min_cluster_size: 50
min_iou: 0.50
n_jobs: -1

gate:
  expected_validation_plots: 5
  max_pointwise_oracle_mean_error: 0.00001
  min_mean_error_reduction_relative: 0.10
  min_p90_error_reduction_relative: 0.05
  min_pointwise_improvement_retained: 0.70
  max_cell_purity_drop: 0.0
  max_multi_tree_collision_increase: 0.0
  min_plot_wins: 4
  min_cluster_f1_gain_pp: 0.50
  max_cluster_tree_recall_drop_pp: 0.50

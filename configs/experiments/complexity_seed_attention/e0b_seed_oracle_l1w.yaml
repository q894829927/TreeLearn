# E0b corrects E0 for partially annotated L1W. Wytham is not used.
pipeline_config: 'configs/experiments/point_transformer/pipeline_l1w_seed_ratio_r100.yaml'
ground_truth_path: 'data/benchmark/L1W_voxelized01_for_eval.laz'
output_dir: 'logs/complexity_seed_attention/e0b_seed_oracle_l1w'

keep_ratio: 0.78
random_seeds: [42, 43, 44]

utility:
  sigma_m: 0.30
  purity_voxel_size: 0.60
  purity_power: 1.0

selection:
  # TreeLearn raw labels: -1 unknown, 0 known non-tree, >0 tree.
  known_label_min: 0
  spatial_vote_cell_size: 0.60
  min_seeds_per_tree: 50

evaluation_thresholds:
  min_iou_for_match: 0.5
  min_precision_for_pred: 0.5
  min_recall_for_gt: 0.5

gate:
  min_f1_gain_pp: 0.50
  min_commission_reduction_pp: 1.00
  max_completeness_drop_pp: 0.50
  min_gain_over_random_pp: 0.25

baseline_reference:
  tp: 156
  fp: 5
  fn: 0

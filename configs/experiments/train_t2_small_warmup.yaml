# Stage 1: initialize from the official small-tree checkpoint and train only
# the newly introduced upper-offset head. The original base anchor is retained
# so the frozen official base-offset head keeps its original target definition.
default_args:
  - "configs/_modular/model.yaml"
  - "configs/_modular/dataset_train.yaml"
  - "configs/_modular/dataset_test.yaml"

seed: 42

dataloader:
  train:
    batch_size: 2
    num_workers: 2
  test:
    batch_size: 1
    num_workers: 1

model:
  spatial_shape: [500, 500, 1000]
  use_upper_anchor: True
  upper_offset_loss_weight: 1.0
  axis_loss_weight: 0.1
  offset_loss_type: 'l2'
  fixed_modules:
    - input_conv
    - unet
    - output_layer
    - semantic_linear
    - offset_linear

dataset_train:
  base_anchor_mode: 'legacy'

dataset_test:
  base_anchor_mode: 'legacy'

optimizer:
  type: 'AdamW'
  lr: 0.001
  weight_decay: 0.001

scheduler:
  t_initial: 50
  lr_min: 0.00001
  cycle_decay: 1
  warmup_lr_init: 0.00001
  warmup_t: 5
  cycle_limit: 1
  t_in_epochs: True

epochs: 50
examples_per_epoch: 500
fp16: True
pretrain: 'data/model_weights/model_weights_with_small_20241213.pth'
grad_norm_clip: True
save_frequency: 10
validation_frequency: 10

  pilot_step: 500
  pilot_plot: G4N
  pilot_max_f1_drop: 0.05
  branch_lr: 0.0003
  weight_decay: 0.001
  gradient_clip: 1.0
  warmup_steps: 30
  save_every: 100
  log_every: 10
  max_open_forests: 2
  outer_half_extent: 17.5
  inner_half_extent: 4.0
  max_points: 393216
  minimum_points: 1024
  # Frozen backbone and heads retain the production FP32 path; branch is small.
  fp16: false
  fp16_retries: 0

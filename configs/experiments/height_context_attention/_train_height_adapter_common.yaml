seed: 42

model:
  spatial_shape: [500, 500, 1000]
  use_upper_anchor: False
  use_axis_branch: False
  use_height_context_adapter: True
  height_hidden_dim: 32
  height_num_bins: 8
  height_num_heads: 4
  height_dropout: 0.1
  height_quantile: 0.95
  height_minimum_scale: 1.0
  height_adapter_only: True
  offset_loss_type: 'smooth_l1'
  smooth_l1_beta: 1.0

dataset_train:
  base_anchor_mode: 'legacy'

dataset_test:
  base_anchor_mode: 'legacy'

dataloader:
  train:
    batch_size: 2
    num_workers: 2
  test:
    batch_size: 1
    num_workers: 1

optimizer:
  type: 'AdamW'
  lr: 0.001
  weight_decay: 0.001

scheduler:
  t_initial: 50
  lr_min: 0.00001
  cycle_decay: 1
  warmup_lr_init: 0.00001
  warmup_t: 5
  cycle_limit: 1
  t_in_epochs: True

epochs: 50
examples_per_epoch: 500
fp16: True
pretrain: 'data/model_weights/model_weights_with_small_20241213.pth'
grad_norm_clip: True
save_frequency: 10
validation_frequency: 5
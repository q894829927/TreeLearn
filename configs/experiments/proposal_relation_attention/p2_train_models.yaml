proposal_relation_training:
  data_root: data/proposal_relation
  output_dir: logs/proposal_relation_attention/p2_models
  train_plots: [A1N, A1W, G1N, G1W, G2N, G2W, G3N, G3W, L2N, L2W, LG1, LG2, LG3]
  validation_plots: [G4N, G4W, L1N, O1N, O1W]
  seeds: [42, 43, 44]
  device: cuda
  node_dim: 64
  edge_dim: 32
  num_layers: 2
  num_heads: 4
  ffn_dim: 128
  dropout: 0.1
  learning_rate: 0.001
  weight_decay: 0.001
  max_epochs: 50
  patience: 12
  negative_ratio: 3.0
  focal_gamma: 2.0
  contrastive_weight: 0.1
  reliability_weight: 0.1
  contrastive_temperature: 0.1
  contrastive_max_trees: 64
  contrastive_nodes_per_tree: 8
  parameter_tolerance: 0.05
  threshold_grid: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  reciprocal_top_k: 2
  max_component_xy_diameter: 15.0
  max_component_height: 60.0
  match_iou_threshold: 0.5
  min_precision_for_counted_fp: 0.5
  gate:
    minimum_edge_ap_gain: 0.01
    maximum_f1_drop_pp: 0.1
    maximum_completeness_drop_pp: 0.5
    maximum_commission_increase_pp: 0.3
    maximum_plot_f1_drop_pp: 1.0
    maximum_f1_std_pp: 0.5

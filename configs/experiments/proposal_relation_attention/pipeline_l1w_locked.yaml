default_args:
  - configs/experiments/height_context_attention/_pipeline_l1w_common.yaml
  - configs/_modular/sample_generation.yaml
  - configs/_modular/model.yaml
  - configs/_modular/grouping.yaml
  - configs/_modular/dataset_test.yaml
pretrain: work_dirs/train_t1_b1_partial_seed42/best_unet.pth
pipeline_base_dir: data/pipeline/L1W
model:
  use_height_context_adapter: false
grouping:
  method: proposal_relation
save_cfg:
  results_dir: results_proposal_relation_l1w_locked
  save_full_forest: true
proposal_relation:
  summary: logs/proposal_relation_attention/p2_models/summary.json
  normalization: logs/proposal_relation_attention/p2_models/normalization.npz
  tree_probability_threshold: 0.5
  tree_class_index: 0
  xy_cell_size: 0.6
  z_bin_size: 0.5
  vertical_split_gap: 1.0
  max_xy_distance: 2.5
  max_xy_bbox_gap: 0.6
  max_vertical_gap: 1.5
  max_neighbors: 16
  node_dim: 64
  edge_dim: 32
  num_layers: 2
  num_heads: 4
  ffn_dim: 128
  dropout: 0.1
  reciprocal_top_k: 2
  max_component_xy_diameter: 15.0
  max_component_height: 60.0
  device: cuda
  save_graph: true
  save_attention_stats: true

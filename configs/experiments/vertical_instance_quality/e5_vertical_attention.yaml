data_root: 'data/instance_quality'
manifest_path: 'data/instance_quality/manifest.csv'
e4_summary_path: 'logs/vertical_quality/e4_vertical_mlp/summary.json'
e4_metrics_path: 'logs/vertical_quality/e4_vertical_mlp/per_seed_metrics.csv'
output_dir: 'logs/vertical_quality/e5_vertical_attention'
seeds: [42, 43, 44]

model:
  hidden_dim: 64
  num_heads: 4
  num_layers: 1
  token_mlp_layers: 2
  feedforward_dim: 128
  instance_hidden_dims: [64, 32]
  dropout: 0.1
  num_vertical_layers: 8

training:
  batch_size: 128
  epochs: 100
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.001
  iou_loss_weight: 0.5

threshold_selection:
  max_completeness_drop: 0.01
  step: 0.01

gate:
  min_f1_improvement: 0.005
  min_commission_reduction: 0.02
  max_completeness_drop: 0.01
  fp_ap_tolerance: 0.0001
  min_paired_seed_wins: 2
  paired_win_tolerance: 0.000001

benchmark:
  warmup_iterations: 10
  measured_iterations: 30

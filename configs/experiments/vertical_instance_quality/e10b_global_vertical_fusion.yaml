data_root: 'data/instance_quality'
manifest_path: 'data/instance_quality/manifest.csv'
output_dir: 'logs/vertical_quality/e10b_global_vertical_fusion'
seeds: [42, 43, 44]

model:
  token_hidden_dim: 32
  token_mlp_layers: 1
  global_projection_dim: 32
  fusion_hidden_dims: [64, 32]
  global_wide_hidden_dims: [112, 64]
  dropout: 0.1

training:
  batch_size: 128
  epochs: 100
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.001
  iou_loss_weight: 0.5

threshold_selection:
  max_completeness_drop: 0.01
  step: 0.01

ratio_grid:
  start: 0.50
  stop: 1.00
  step: 0.01

gate:
  max_parameter_difference_ratio: 0.10
  min_seed_wins: 2
  min_mean_effect_pp: 0.25

data_root: 'data/instance_quality'
manifest_path: 'data/instance_quality/manifest.csv'
baseline_summary_path: 'logs/vertical_quality/e3_global_baselines/summary.json'
output_dir: 'logs/vertical_quality/e4_vertical_mlp'
seeds: [42, 43, 44]

model:
  token_hidden_dim: 64
  token_mlp_layers: 2
  instance_hidden_dims: [64, 32]
  dropout: 0.1

training:
  batch_size: 128
  epochs: 100
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.001
  iou_loss_weight: 0.5

threshold_selection:
  max_completeness_drop: 0.01
  step: 0.01

gate:
  min_iou_mae_improvement: 0.002
  min_fp_ap_improvement: 0.002
  max_f1_sample_std: 0.01
  f1_tolerance: 0.000001

expected_num_layers: 8
